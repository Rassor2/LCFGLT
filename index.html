<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCFGLT</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #0d1f0d 30%, #1a3a1a 60%, #0d2d0d 100%);
            height: 100vh;
            width: 100vw;
            font-family: 'UnifrakturMaguntia', 'Times New Roman', serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .beer {
            position: absolute;
            font-size: 40px;
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            will-change: transform;
            left: 0;
            top: 0;
        }

        .curve-text {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            color: #39ff14;
            font-size: clamp(1rem, 3vw, 2rem);
            text-align: center;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.6), 0 0 40px rgba(57, 255, 20, 0.3);
            letter-spacing: 0.2em;
            z-index: 10;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #39ff14;
            font-size: clamp(2rem, 8vw, 6rem);
            font-weight: 900;
            text-align: center;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.6), 0 0 40px rgba(57, 255, 20, 0.3);
            letter-spacing: 0.1em;
            z-index: 10;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .subtitle {
            position: absolute;
            top: 62%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(57, 255, 20, 0.5);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            text-align: center;
            z-index: 10;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(57, 255, 20, 0.6), 0 0 40px rgba(57, 255, 20, 0.3); }
            to { text-shadow: 0 0 30px rgba(57, 255, 20, 0.8), 0 0 60px rgba(57, 255, 20, 0.5), 0 0 80px rgba(57, 255, 20, 0.3); }
        }
    </style>
</head>
<body>
    <div id="container">
        <svg class="curve-text" viewBox="0 0 500 100" style="width: clamp(300px, 60vw, 600px); height: auto;">
            <defs>
                <path id="curve" d="M 50,80 Q 250,10 450,80" fill="transparent"/>
            </defs>
            <text fill="#39ff14" font-size="24" text-anchor="middle" font-family="'UnifrakturMaguntia', serif">
                <textPath href="#curve" startOffset="50%">
                    4 - 80 - 103 - 104 - 133
                </textPath>
            </text>
        </svg>
        <div class="title">LCFGLT</div>
        <div class="subtitle">🐸 Landing Page 🐸</div>
    </div>

    <script>
        const container = document.getElementById('container');
        const beers = [];
        const emojis = ['🐸', '🐸', '🐸'];

        function calculateBeerCount() {
            const area = window.innerWidth * window.innerHeight;
            return Math.max(15, Math.floor(area / 30000));
        }

        function createBeer() {
            const beer = document.createElement('div');
            beer.className = 'beer';
            beer.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            
            const size = 30 + Math.random() * 30;
            beer.style.fontSize = size + 'px';
            
            const x = Math.random() * (window.innerWidth - size);
            const y = Math.random() * (window.innerHeight - size);
            
            beer.style.transform = `translate(${x}px, ${y}px)`;
            
            container.appendChild(beer);
            
            return {
                el: beer,
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                size: size
            };
        }

        function initBeers() {
            const count = calculateBeerCount();
            for (let i = 0; i < count; i++) {
                beers.push(createBeer());
            }
        }

        function animate() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            for (const b of beers) {
                b.x += b.vx;
                b.y += b.vy;
                
                if (b.x <= 0) {
                    b.x = 0;
                    b.vx = Math.abs(b.vx);
                } else if (b.x + b.size >= w) {
                    b.x = w - b.size;
                    b.vx = -Math.abs(b.vx);
                }
                
                if (b.y <= 0) {
                    b.y = 0;
                    b.vy = Math.abs(b.vy);
                } else if (b.y + b.size >= h) {
                    b.y = h - b.size;
                    b.vy = -Math.abs(b.vy);
                }
                
                b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
            }
            
            requestAnimationFrame(animate);
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const targetCount = calculateBeerCount();
                const currentCount = beers.length;
                
                if (targetCount > currentCount) {
                    for (let i = currentCount; i < targetCount; i++) {
                        beers.push(createBeer());
                    }
                } else if (targetCount < currentCount) {
                    for (let i = currentCount - 1; i >= targetCount; i--) {
                        beers[i].el.remove();
                        beers.pop();
                    }
                }
            }, 200);
        });

        initBeers();
        animate();
    </script>
</body>
</html>
